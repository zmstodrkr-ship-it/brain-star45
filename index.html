<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이미 일어난 일처럼</title>
    <meta name="description" content="조 디스펜자 · 아홉 주의 회복" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0c0b0a; font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
      .stage { position: relative; height: 100dvh; width: min(100vw, calc(100dvh * 9 / 16)); overflow: hidden; background: #0c0b0a; }
      video { display: block; width: 100%; height: 100%; object-fit: cover; }
      .caption {
        position: absolute; left: 12px; right: 12px; bottom: 72px; z-index: 3;
        margin: 0; padding: 12px 14px; border-radius: 14px;
        background: rgba(12,11,10,.72); color: #fff8f3;
        font-size: 1.05rem; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em;
        text-align: center;
      }
      .hint {
        position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        z-index: 4; padding: .85rem 1.2rem; border-radius: 999px;
        background: #c45c26; color: #fff8f3; font-size: .95rem; font-weight: 600;
      }
      .hint[hidden] { display: none; }
      .title {
        position: absolute; left: 0; right: 0; top: 48px; z-index: 3;
        text-align: center; color: #fff8f3; pointer-events: none;
      }
      .title small { display: block; font-size: 12px; letter-spacing: .18em; color: rgba(255,248,243,.7); margin-bottom: 8px; }
      .title h1 { margin: 0; font-size: 28px; font-weight: 600; }
      .title[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <video id="film" src="film.mp4?v=en" poster="poster.jpg" autoplay muted playsinline controls preload="auto"></video>
      <div class="title" id="title">
        <small>조 디스펜자 · 아홉 주의 회복</small>
        <h1>이미 일어난 일처럼</h1>
      </div>
      <p class="caption" id="caption">1986년. 한 젊은 의사가 인생을 바꾸는 사고를 당했습니다.</p>
      <button class="hint" id="hint" type="button">탭하면 영어 내레이션이 켜집니다</button>
    </div>
    <script>
      const shots = [
        [6.8, "1986년. 한 젊은 의사가 인생을 바꾸는 사고를 당했습니다."],
        [5.6, "자전거 경기 도중, 사륜구동 차량과 충돌했습니다."],
        [6.4, "의사는 말했습니다. 척추 수술이 아니면, 다시 걷지 못할 수도 있다고."],
        [6.2, "그는 수술을 거부했습니다. 그리고 스스로 치유하기로 결심했습니다."],
        [5.2, "매일 밤, 잠들기 전 이십 분."],
        [6.4, "그는 척추가 완전히 회복된 모습을, 선명하게 그려냈습니다."],
        [5.6, "이미 일어난 일처럼. 현관문을 열고 스스로 걸어나가는 감각까지."],
        [5.2, "하루도 빠짐없이. 구 주 동안."],
        [6.0, "몸이 천천히 반응하기 시작했습니다."],
        [6.2, "구 주 후, 그는 병상에서 일어나 스스로 걸었습니다."],
        [6.0, "십이 주 뒤, 그는 다시 흰 가운을 입고 진료실로 돌아갔습니다."],
        [5.6, "피아노를 상상만 해도, 실제 연습과 비슷한 뇌 변화가 일어납니다."],
        [5.6, "환경이 바뀌면, 몸의 나이도 달라집니다."],
        [4.2, "압박 속에서도 확언을 반복한 사람은,"],
        [4.0, "흔들리지 않았습니다."],
        [4.6, "결국 결과를 바꿨습니다."],
        [5.2, "잠들기 전, 스마트폰을 멀리 두세요."],
        [5.6, "원하는 단 한 장면을, 이미 일어난 것처럼 느끼세요."],
        [5.2, "그리고 감사함을 느끼세요."],
        [7.4, "몸이 바뀌기 전에, 마음이 먼저 바뀝니다."]
      ];
      const video = document.getElementById("film");
      const caption = document.getElementById("caption");
      const hint = document.getElementById("hint");
      const title = document.getElementById("title");
      const unlock = () => { video.muted = false; video.play().catch(() => {}); hint.hidden = true; };
      hint.addEventListener("click", unlock);
      video.addEventListener("pointerdown", unlock);
      video.addEventListener("timeupdate", () => {
        let t = video.currentTime;
        title.hidden = t >= 4;
        for (const [dur, text] of shots) {
          if (t < dur) { caption.textContent = text; return; }
          t -= dur;
        }
        caption.textContent = shots[shots.length - 1][1];
      });
      video.play().catch(() => {});
    </script>
  </body>
</html>
