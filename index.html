<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이미 일어난 일처럼</title>
    <meta name="description" content="조 디스펜자 · 아홉 주의 회복" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0c0b0a;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage {
        position: relative;
        height: 100dvh;
        width: min(100vw, calc(100dvh * 9 / 16));
        background: #0c0b0a;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hint {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        padding: 0.85rem 1.2rem;
        border-radius: 999px;
        background: #c45c26;
        color: #fff8f3;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <video
        id="film"
        src="film.mp4"
        poster="poster.jpg"
        autoplay
        muted
        playsinline
        controls
        preload="auto"
      ></video>
      <div class="hint" id="hint">탭하면 소리가 켜집니다</div>
    </div>
    <script>
      const video = document.getElementById("film");
      const hint = document.getElementById("hint");
      const unlock = () => {
        video.muted = false;
        video.play().catch(() => {});
        hint.hidden = true;
      };
      video.addEventListener("pointerdown", unlock);
      hint.addEventListener("click", unlock);
      video.play().catch(() => {});
    </script>
  </body>
</html>
