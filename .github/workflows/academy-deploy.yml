name: STAR45 Revenue Academy deploy
on:
  pull_request:
    paths:
      - 'academy/**'
      - 'tests/smoke-academy.mjs'
      - '.github/workflows/academy-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - 'tests/smoke-academy.mjs'
      - '.github/workflows/academy-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('brain-star45-academy-pr-{0}', github.event.pull_request.number) || 'brain-star45-academy-deploy-v1' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-academy.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate brain.star45.net root, backup, deploy academy, verify, rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          CONF="$(grep -Rsl 'server_name.*brain\.star45\.net' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)"
          if [ -z "$CONF" ]; then
            echo 'Unable to locate brain.star45.net nginx config'
            exit 1
          fi
          LIVE_ROOT="$(awk '$1=="root" {gsub(";","",$2); print $2; exit}' "$CONF")"
          if [ -z "${LIVE_ROOT:-}" ] || [ ! -d "$LIVE_ROOT" ]; then
            echo 'Unable to locate brain.star45.net static document root'
            exit 1
          fi
          TARGET="$LIVE_ROOT/academy"
          STAGE="$LIVE_ROOT/.academy-next-${GITHUB_RUN_ID}"
          BACKUP="$LIVE_ROOT/.academy-backup-${GITHUB_RUN_ID}"
          sudo rm -rf "$STAGE"
          sudo mkdir -p "$STAGE"
          sudo cp -a academy/. "$STAGE/"
          if [ -d "$TARGET" ]; then sudo mv "$TARGET" "$BACKUP"; fi
          sudo mv "$STAGE" "$TARGET"
          verify() {
            curl -kfsSL --max-time 15 -H 'Host: brain.star45.net' http://127.0.0.1/academy/ | grep -q 'STAR45 Revenue Academy'
          }
          if verify; then
            echo 'STAR45_REVENUE_ACADEMY_LOCAL_HTTP_PASS'
            [ -d "$BACKUP" ] && sudo rm -rf "$BACKUP"
          else
            echo 'Verification failed; rolling back'
            sudo rm -rf "$TARGET"
            [ -d "$BACKUP" ] && sudo mv "$BACKUP" "$TARGET"
            exit 1
          fi
  public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public HTTPS verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --max-time 20 https://brain.star45.net/academy/ | grep -q 'STAR45 Revenue Academy'
          echo 'STAR45_REVENUE_ACADEMY_PUBLIC_HTTPS_PASS'
